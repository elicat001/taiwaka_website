<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太哇卡咖啡 - 管理后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.8);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            margin: 0.25rem 0;
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        .stat-card {
            border-left: 4px solid;
            transition: transform 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .table-actions button {
            margin: 0 0.25rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar p-3">
                <div class="position-sticky">
                    <h4 class="mb-4 text-center">太哇卡咖啡</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" data-section="dashboard">
                                <i class="bi bi-speedometer2"></i> 仪表板
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-section="categories">
                                <i class="bi bi-tags"></i> 分类管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-section="products">
                                <i class="bi bi-box"></i> 产品管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-section="articles">
                                <i class="bi bi-file-text"></i> 文章管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-section="orders">
                                <i class="bi bi-cart"></i> 订单管理
                            </a>
                        </li>
                        <li class="nav-item mt-4">
                            <a class="nav-link" href="#" id="logoutBtn">
                                <i class="bi bi-box-arrow-right"></i> 退出登录
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div id="content-area">
                    <!-- Dashboard Section -->
                    <div id="dashboard-section" class="content-section">
                        <h2>仪表板</h2>
                        <div class="row mt-4" id="statsCards">
                            <!-- Stats cards will be loaded here -->
                        </div>
                    </div>

                    <!-- Categories Section -->
                    <div id="categories-section" class="content-section d-none">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2>分类管理</h2>
                            <button class="btn btn-primary" onclick="showAddCategoryModal()">
                                <i class="bi bi-plus-lg"></i> 添加分类
                            </button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>名称</th>
                                        <th>图标</th>
                                        <th>描述</th>
                                        <th>产品数量</th>
                                        <th>状态</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="categoriesTable"></tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Products Section -->
                    <div id="products-section" class="content-section d-none">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2>产品管理</h2>
                            <button class="btn btn-primary" onclick="showAddProductModal()">
                                <i class="bi bi-plus-lg"></i> 添加产品
                            </button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>图片</th>
                                        <th>名称</th>
                                        <th>分类</th>
                                        <th>价格</th>
                                        <th>库存</th>
                                        <th>状态</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="productsTable"></tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Articles Section -->
                    <div id="articles-section" class="content-section d-none">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2>文章管理</h2>
                            <button class="btn btn-primary" onclick="showAddArticleModal()">
                                <i class="bi bi-plus-lg"></i> 添加文章
                            </button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>标题</th>
                                        <th>分类</th>
                                        <th>作者</th>
                                        <th>浏览量</th>
                                        <th>状态</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="articlesTable"></tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Orders Section -->
                    <div id="orders-section" class="content-section d-none">
                        <h2>订单管理</h2>
                        <div class="table-responsive mt-4">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>订单号</th>
                                        <th>客户</th>
                                        <th>电话</th>
                                        <th>金额</th>
                                        <th>状态</th>
                                        <th>支付状态</th>
                                        <th>创建时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="ordersTable"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';

        // Navigation
        document.querySelectorAll('.sidebar .nav-link').forEach(link => {
            link.addEventListener('click', function(e) {
                if (this.id !== 'logoutBtn') {
                    e.preventDefault();
                    document.querySelectorAll('.sidebar .nav-link').forEach(l => l.classList.remove('active'));
                    this.classList.add('active');

                    const section = this.dataset.section;
                    document.querySelectorAll('.content-section').forEach(s => s.classList.add('d-none'));
                    document.getElementById(`${section}-section`).classList.remove('d-none');

                    if (section === 'dashboard') loadDashboard();
                    else if (section === 'categories') loadCategories();
                    else if (section === 'products') loadProducts();
                    else if (section === 'articles') loadArticles();
                    else if (section === 'orders') loadOrders();
                }
            });
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await fetch(`${API_URL}/api/auth/logout`, {
                    method: 'POST',
                    credentials: 'include'
                });
                window.location.href = '/admin/login';
            } catch (error) {
                console.error('Logout error:', error);
            }
        });

        // Load Dashboard
        async function loadDashboard() {
            try {
                const response = await fetch(`${API_URL}/api/orders/statistics`, {
                    credentials: 'include'
                });
                const stats = await response.json();

                document.getElementById('statsCards').innerHTML = `
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card border-primary">
                            <div class="card-body">
                                <h5 class="card-title text-muted">总订单</h5>
                                <h2>${stats.total_orders || 0}</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card border-warning">
                            <div class="card-body">
                                <h5 class="card-title text-muted">待处理</h5>
                                <h2>${stats.pending_orders || 0}</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card border-success">
                            <div class="card-body">
                                <h5 class="card-title text-muted">已完成</h5>
                                <h2>${stats.completed_orders || 0}</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card border-info">
                            <div class="card-body">
                                <h5 class="card-title text-muted">总收入</h5>
                                <h2>¥${stats.total_revenue || 0}</h2>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Load dashboard error:', error);
            }
        }

        // Load Categories
        async function loadCategories() {
            try {
                const response = await fetch(`${API_URL}/api/categories?is_active=`, {
                    credentials: 'include'
                });
                const categories = await response.json();

                const tbody = document.getElementById('categoriesTable');
                tbody.innerHTML = categories.map(cat => `
                    <tr>
                        <td>${cat.id}</td>
                        <td>${cat.name}</td>
                        <td>${cat.icon || '-'}</td>
                        <td>${cat.description || '-'}</td>
                        <td>${cat.product_count || 0}</td>
                        <td><span class="badge ${cat.is_active ? 'bg-success' : 'bg-secondary'}">${cat.is_active ? '启用' : '禁用'}</span></td>
                        <td class="table-actions">
                            <button class="btn btn-sm btn-warning" onclick="editCategory(${cat.id})"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-sm btn-danger" onclick="deleteCategory(${cat.id})"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Load categories error:', error);
            }
        }

        // Load Products
        async function loadProducts() {
            try {
                const response = await fetch(`${API_URL}/api/products?is_active=`, {
                    credentials: 'include'
                });
                const data = await response.json();

                const tbody = document.getElementById('productsTable');
                tbody.innerHTML = data.products.map(product => `
                    <tr>
                        <td>${product.id}</td>
                        <td><img src="${product.image_url || '/api/static/no-image.png'}" width="50" height="50" class="rounded"></td>
                        <td>${product.name}</td>
                        <td>${product.category_name || '-'}</td>
                        <td>¥${product.price}</td>
                        <td>${product.stock}</td>
                        <td><span class="badge ${product.is_active ? 'bg-success' : 'bg-secondary'}">${product.is_active ? '上架' : '下架'}</span></td>
                        <td class="table-actions">
                            <button class="btn btn-sm btn-warning" onclick="editProduct(${product.id})"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-sm btn-danger" onclick="deleteProduct(${product.id})"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Load products error:', error);
            }
        }

        // Load Articles
        async function loadArticles() {
            try {
                const response = await fetch(`${API_URL}/api/articles?is_published=&include_content=false`, {
                    credentials: 'include'
                });
                const data = await response.json();

                const tbody = document.getElementById('articlesTable');
                tbody.innerHTML = data.articles.map(article => `
                    <tr>
                        <td>${article.id}</td>
                        <td>${article.title}</td>
                        <td>${article.category || '-'}</td>
                        <td>${article.author || '-'}</td>
                        <td>${article.view_count || 0}</td>
                        <td><span class="badge ${article.is_published ? 'bg-success' : 'bg-secondary'}">${article.is_published ? '已发布' : '草稿'}</span></td>
                        <td class="table-actions">
                            <button class="btn btn-sm btn-warning" onclick="editArticle(${article.id})"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-sm btn-danger" onclick="deleteArticle(${article.id})"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Load articles error:', error);
            }
        }

        // Load Orders
        async function loadOrders() {
            try {
                const response = await fetch(`${API_URL}/api/orders`, {
                    credentials: 'include'
                });
                const data = await response.json();

                const tbody = document.getElementById('ordersTable');
                tbody.innerHTML = data.orders.map(order => `
                    <tr>
                        <td>${order.order_number}</td>
                        <td>${order.customer_name}</td>
                        <td>${order.customer_phone}</td>
                        <td>¥${order.total_amount}</td>
                        <td><span class="badge bg-primary">${order.status}</span></td>
                        <td><span class="badge ${order.payment_status === 'paid' ? 'bg-success' : 'bg-warning'}">${order.payment_status}</span></td>
                        <td>${new Date(order.created_at).toLocaleString('zh-CN')}</td>
                        <td class="table-actions">
                            <button class="btn btn-sm btn-info" onclick="viewOrder(${order.id})"><i class="bi bi-eye"></i></button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Load orders error:', error);
            }
        }

        // Placeholder functions for modals
        function showAddCategoryModal() { alert('添加分类功能待实现'); }
        function showAddProductModal() { alert('添加产品功能待实现'); }
        function showAddArticleModal() { alert('添加文章功能待实现'); }
        function editCategory(id) { alert('编辑分类 ' + id); }
        function deleteCategory(id) { if(confirm('确定删除?')) { /* API call */ } }
        function editProduct(id) { alert('编辑产品 ' + id); }
        function deleteProduct(id) { if(confirm('确定删除?')) { /* API call */ } }
        function editArticle(id) { alert('编辑文章 ' + id); }
        function deleteArticle(id) { if(confirm('确定删除?')) { /* API call */ } }
        function viewOrder(id) { alert('查看订单 ' + id); }

        // Load dashboard on page load
        loadDashboard();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
