
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太哇卡咖啡 Taiwaka Coffee | 猎寻原生之味</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;700;900&family=Noto+Serif+SC:wght@200;500;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand: #3B2182;
            --bg: #FFFFFF;
            --fg: #1A1A1A;
            --muted: #8E8E93;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            background-color: var(--bg);
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: var(--fg);
        }

        /* 极致图像优化 */
        img, svg {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            shape-rendering: geometricPrecision;
        }

        /* 隐藏滚动条但保留功能 */
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* 高级动效 */
        .reveal-up {
            opacity: 0;
            transform: translateY(40px);
            transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .reveal-up.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* 蓝瓶式按钮 */
        .btn-premium {
            position: relative;
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .btn-premium::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: rgba(255,255,255,0.2);
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .btn-premium:hover::after { left: 100%; }

        /* 文本排版增强 */
        .serif-title { font-family: 'Noto Serif SC', serif; }
        .tracking-widest-plus { letter-spacing: 0.6em; }

        /* 网格悬停 */
        .product-card img { transition: transform 1.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .product-card:hover img { transform: scale(1.05); }

        @keyframes subtle-zoom {
            from { transform: scale(1.05); }
            to { transform: scale(1.15); }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
