
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太哇卡咖啡 Taiwaka Coffee | 匠心火山烘焙</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 品牌比例分配 */
            --brand-main: #3B2182;      /* 80% Pantone Violet C */
            --brand-deep: #280071;      /* 10% Pantone 2745 C */
            --brand-white: #FFFFFF;     /* 10% Pantone White */
            
            --bg-clean: #FFFFFF;
            --text-main: #1A1A1A;
            
            /* 辅助色映射 (用于点缀) */
            --color-coffee: #ca3604;
            --color-equip: #2c5234;
            --color-merch: #f65275;
        }
        
        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: var(--brand-main); /* 默认主色调背景 */
            color: var(--brand-white);
            line-height: 1.6;
        }

        .brand-bg-main { background-color: var(--brand-main); }
        .brand-bg-deep { background-color: var(--brand-deep); }
        .brand-text-main { color: var(--brand-main); }
        .brand-text-white { color: var(--brand-white); }
        
        /* 阅读区白底覆盖 */
        .content-section {
            background-color: var(--brand-white);
            color: var(--text-main);
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::selection {
            background: var(--brand-deep);
            color: var(--brand-white);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--brand-main);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--brand-deep);
            border-radius: 10px;
        }
    </style>
<script type="importmap">
{

    "react/": "https://esm.sh/react@^19.2.3/",

    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body class="overflow-x-hidden">
    <div id="root"></div>
</body>
</html>
